name: Android APK (debug)

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 needs JDK 21 (JDK 17 is too old for its Android Gradle Plugin)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK (ANDROID_HOME, licences accepted); Gradle fetches missing platforms itself
      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        run: npm ci

      - name: Copy web app to www/ and sync Capacitor
        run: |
          node tools/copy-www.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/MobileDAW-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobileDAW-debug-apk
          path: dist/*.apk
          retention-days: 30
