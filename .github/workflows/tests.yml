name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: "Playwright + Chromium (browser tests: freeze-e2e, android-engine-test, wasm-web-test)"
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Syntax, sw.js assets and all tests in tools/
        run: node tools/run-tests.mjs
      - name: Golden tests (C++ engine vs JS engine, sample by sample)
        run: node tools/golden/golden.mjs
